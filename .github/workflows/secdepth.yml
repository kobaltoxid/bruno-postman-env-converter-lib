name: SecDepth dependency scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: secdepth-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ACTION_RUN_ID: ${{ github.run_id }}
      ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false

      - name: Check out SecDepth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secdepth
          ref: f371a9725cb17163d21b7390f3c5c1e811e6f005
          path: secdepth
          persist-credentials: false

      - name: Verify and run SecDepth
        shell: bash
        env:
          SECDEPTH_CACHE: ${{ runner.temp }}/secdepth-cache
        run: |
          set -euo pipefail
          mkdir -p "$SECDEPTH_CACHE" "$RUNNER_TEMP/secdepth-results"
          scan_log="$RUNNER_TEMP/secdepth-results/scan.log"
          : > "$scan_log"
          fail() {
            printf '%s\n' "ERROR: $1" >> "$scan_log"
            exit 1
          }
          actual_sha="$(git -C target rev-parse HEAD 2>>"$scan_log")" || fail "could not read the target revision"
          test "$actual_sha" = "$PR_HEAD_SHA" || fail "target HEAD did not match the pull request head SHA"
          test -f target/package.json && test ! -L target/package.json || fail "package.json is not a regular file"
          lockfile=""
          if test -e target/npm-shrinkwrap.json || test -L target/npm-shrinkwrap.json; then
            test -f target/npm-shrinkwrap.json && test ! -L target/npm-shrinkwrap.json || fail "npm-shrinkwrap.json is not a regular file"
            lockfile=target/npm-shrinkwrap.json
          elif test -e target/package-lock.json || test -L target/package-lock.json; then
            test -f target/package-lock.json && test ! -L target/package-lock.json || fail "package-lock.json is not a regular file"
            lockfile=target/package-lock.json
          fi
          test -n "$lockfile" || fail "no usable npm lockfile found"
          printf '%s\n' "Using $lockfile" >> "$scan_log"
          python3 -I secdepth/skills/secdepth/scripts/scan.py \
            "$GITHUB_WORKSPACE/target" \
            --output "$RUNNER_TEMP/secdepth-results" \
            >> "$scan_log" 2>&1

      - name: Write run metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secdepth-results"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "pull_request": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["PR_HEAD_SHA"],
              "run_id": int(os.environ["ACTION_RUN_ID"]),
              "run_attempt": int(os.environ["ACTION_RUN_ATTEMPT"]),
          }
          Path(os.environ["RUNNER_TEMP"], "secdepth-results", "run.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload SecDepth reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secdepth-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secdepth-results
          if-no-files-found: error
          retention-days: 7
